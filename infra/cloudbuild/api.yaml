# Build Frego API image from monorepo root.
# Usage:
#   gcloud builds submit --project=voltei-e9d6d --config=infra/cloudbuild/api.yaml \
#     --substitutions=_TAG=YYYYMMDD-HHMMSS .
substitutions:
  _TAG: latest
  _REGION: southamerica-east1
  _REPO: voltei
  _IMAGE: api

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - -f
      - services/api/Dockerfile
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
